[project]
name = "opinion-structure-across-societies"
version = "1.0.0"
description = "Code for the analysis of opinion structure in surveys and social media across the US, Europe and China"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fire>=0.6",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "fastparquet>=2024.2",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "tqdm>=4.66",
    "openpyxl>=3.1",
    "nltk>=3.8",
]

[project.optional-dependencies]
# OpenAI embeddings for words missing from data/embedding/cached_embedding.pkl
openai = ["openai>=1.30"]
# word2vec robustness check (robustness/run_word2vec.sh)
word2vec = ["gensim>=4.3"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
